[package]
name = "a2a-axum"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
a2a = { workspace = true }
a2a-server = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
a2a-client = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net"] }
time = { workspace = true }
futures-util = { workspace = true }

[[example]]
name = "echo_agent"

[[example]]
name = "streaming_agent"

[[example]]
name = "stateful_agent"
